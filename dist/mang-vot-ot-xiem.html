<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Măng vót ớt xiêm - OCOP Quảng Ngãi</title>
    <meta name="description" content="Măng vót ớt xiêm đạt hạng OCOP 3 sao tại Xã Ba Vì, tỉnh Quảng Ngãi. Sản xuất bởi Hộ kinh doanh Vũ Đức Thắng.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --primary-light: #ecfdf5;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background-color: #f8fafc; color: var(--text-main); line-height: 1.6; }
        
        header { background: linear-gradient(135deg, #047857 0%, #10b981 100%); color: white; padding: 20px; text-align: center; }
        header a { color: white; text-decoration: none; font-weight: 600; font-size: 14px; display: inline-block; margin-bottom: 10px; }
        header h1 { margin: 0; font-size: 24px; font-weight: 800; }

        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .product-detail-card { background: white; border-radius: 16px; padding: 30px; box-shadow: var(--shadow-md); border: 1px solid #e2e8f0; }
        
        .badge { display: inline-block; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 12px; }
        .meta-info { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
        
        /* Hiển thị ảnh sản phẩm chi tiết */
        .detail-img-container { text-align: center; margin-bottom: 25px; }
        .detail-img-container img { max-width: 100%; max-height: 420px; object-fit: cover; border-radius: 12px; box-shadow: var(--shadow-md); }

        .content-body { font-size: 15px; color: #334155; line-height: 1.8; margin-bottom: 30px; border-top: 1px solid #f1f5f9; padding-top: 20px; }

        /* Nút Mua ngay / Liên hệ */
        .btn-buy-now {
            display: block;
            width: 100%;
            max-width: 380px;
            margin: 25px auto 10px auto;
            text-align: center;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);
            transition: all 0.25s ease;
            cursor: pointer;
            border: none;
        }
        .btn-buy-now:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(5, 150, 105, 0.4); }

        footer { text-align: center; padding: 25px; color: var(--text-muted); font-size: 13px; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html">❮ Quay lại trang chủ</a>
        <h1>Măng vót ớt xiêm</h1>
    </header>

    <main class="container">
        <div class="product-detail-card">
            <span class="badge">⭐ OCOP 3 SAO</span>
            <p class="meta-info">📍 Địa phương: <strong>Xã Ba Vì</strong> | 🏷️ Chuyên mục: <strong>Thực phẩm</strong></p>
            
            <!-- Ảnh sản phẩm (nếu không có link sẽ tự động ẩn) -->
            

            <div class="content-body">
                Măng vót ớt xiêm là sản phẩm OCOP 3 sao nổi tiếng thuộc khu vực Xã Ba Vì. Đơn vị sản xuất: Hộ kinh doanh Vũ Đức Thắng.
            </div>

            <!-- Nút mua ngay có hộp thoại bật lên hỏi đồng ý trước khi chuyển sang trang ngoài -->
            <a href="#" target="_blank" class="btn-buy-now" onclick="return confirmPurchase(event, '#')">
                🛒 Liên hệ / Mua ngay sản phẩm này
            </a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 - OCOP Quảng Ngãi</p>
    </footer>

    <script>
        function confirmPurchase(event, targetUrl) {
            if (!targetUrl || targetUrl === '#') {
                alert('Sản phẩm hiện chưa cập nhật đường dẫn mua hàng / liên hệ trực tiếp!');
                return false;
            }
            
            // Hiện popup thông báo xác nhận người dùng đồng ý mới cho chuyển trang
            const userAgreed = confirm('Bạn có muốn chuyển sang trang liên hệ/mua trực tiếp sản phẩm này không?');
            
            if (!userAgreed) {
                event.preventDefault(); // Hủy sự kiện chuyển trang nếu bấm Cancel
                return false;
            }
            return true; // Cho phép chuyển trang nếu bấm OK
        }
    </script>
</body>
</html>
