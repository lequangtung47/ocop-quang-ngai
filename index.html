<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Mục Sản Phẩm OCOP Quảng Ngãi - Đặc Sản Chính Gốc</title>
    <meta name="description" content="Khám phá và kết nối 100+ sản phẩm OCOP Quảng Ngãi đạt chuẩn 3 sao, 4 sao, 5 sao: Tỏi Lý Sơn, Mạch nha, Đường phèn, Nước mắm Mười Quý...">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f8; }
        header { text-align: center; padding: 20px 0; background: #00875a; color: white; border-radius: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .badge { background: #ff9800; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

    <header>
        <h1>SẢN PHẨM OCOP QUẢNG NGÃI</h1>
        <p>Kết nối trực tiếp đặc sản Quảng Ngãi đến người tiêu dùng</p>
    </header>

    <main class="grid">
        <!-- Sản phẩm mẫu 1 -->
        <div class="card">
            <span class="badge">OCOP 4 SAO</span>
            <h3>Tỏi Lý Sơn Nhiều Nhánh</h3>
            <p>Huyện Lý Sơn, Quảng Ngãi</p>
            <a href="#">Xem chi tiết & Mua hàng</a>
        </div>
        
        <!-- Sản phẩm mẫu 2 -->
        <div class="card">
            <span class="badge">OCOP 3 SAO</span>
            <h3>Mạch Nha Mộ Đức</h3>
            <p>Huyện Mộ Đức, Quảng Ngãi</p>
            <a href="#">Xem chi tiết & Mua hàng</a>
        </div>
    </main>

</body>
</html>
